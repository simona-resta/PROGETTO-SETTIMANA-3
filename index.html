<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week Project — Settimana III</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header>
    <div class="header-content">
      <h1>Il mio Passaporto Virtuale</h1>
      <p>Traccia e pianifica le mete dei tuoi sogni</p>
      <button id="btn-tema">Tema scuro</button>
    </div>
  </header>

  <div class="container">

    <section class="sezione-form">
      <form id="form-viaggio">
        <div class="campo-form">
          <label>Meta</label>
          <input id="input-meta" type="text" placeholder="Es. Tokyo..." />
        </div>
        <div class="campo-form">
          <label>Continente</label>
          <input id="input-continente" type="text" placeholder="Es. Asia..." />
        </div>
        <div class="campo-form">
          <label>Anno</label>
          <input id="input-anno" type="number" placeholder="2024" />
        </div>
        <div class="campo-form">
          <label>Categoria</label>
          <select id="input-categoria">
            <option value="Relax">Relax</option>
            <option value="Avventura">Avventura</option>
            <option value="Culturale">Culturale</option>
          </select>
        </div>
        <div class="campo-form">
          <label>Stato</label>
          <select id="select-stato">
            <option value="false">Da visitare</option>
            <option value="true">Visitato</option>
          </select>
        </div>
        
        <button type="submit" class="btn-aggiungi">Aggiungi Meta</button>
      </form>
    </section>

    <h2>Mete Totali</h2>

    <section class="sezione-controlli">
      <div class="controllo-item cerca-lungo">
        <label>Cerca</label>
        <input id="input-ricerca" type="text" placeholder="Cerca meta o continente..." />
      </div>

      <div class="controllo-item filtro-medio">
        <label>Filtri</label>
        <select id="filtro-stato">
          <option value="tutti">Tutti</option>
          <option value="visitato">Visitati</option>
          <option value="da-visitare">Da visitare</option>
        </select>
      </div>

      <div class="controllo-item categoria-medio">
        <label>Categoria</label>
        <select id="filtro-categoria">
          <option value="tutti">Tutte</option>
          <option value="Relax">Relax</option>
          <option value="Avventura">Avventura</option>
          <option value="Culturale">Culturale</option>
        </select>
      </div>

      <div class="controllo-item ordine-medio">
        <label>Ordine</label>
        <select id="ordine-selezionato">
          <option value="manuale">Manuale</option>
          <option value="anno-crescente">Anno crescente</option>
          <option value="anno-decrescente">Anno decrescente</option>
          <option value="meta-az">Alfabetico (A-Z)</option>
          <option value="meta-za">Alfabetico (Z-A)</option>
        </select>
      </div>

      <div class="controllo-item vista-medio">
        <label>Vista</label>
        <button id="btn-vista-lista">Lista</button>
        <button id="btn-vista-card">Card</button>
        <button id="btn-vista-tabella">Tabella</button>
      </div>
    </section>

    <section class="sezione-statistiche">
      <div class="box-statistiche">
        <h3>Mete</h3>
        
        <div class="numeri-stat">
          <div class="stat-blocco"><strong id="stat-totale">0</strong><br>Totale</div>
          <div class="stat-blocco text-verde"><strong id="stat-visitati">0</strong><br>Visitati</div>
          <div class="stat-blocco text-blu"><strong id="stat-da-visitare">0</strong><br>Da visitare</div>
        </div>

        <p>Percentuale visti</p>
        <div class="barra-grigia">
          <div id="barra-riempimento" style="width: 0%;"></div>
        </div>
      </div>
    </section>

    <section class="sezione-lista">
      <div id="lista-mete">
      </div>
    </section>

  </div>

  <footer>
    <p>&copy; 2026 Il mio Passaporto Virtuale</p>
  </footer>

  <div id="notifica">Meta aggiornata!</div>

  <script src="assets/js/script.js"></script>
</body>
</html>
